services:
  demo-server:
    image: ghcr.io/minecraftstats/demo-server:latest
    # Uncomment to build from source instead of pulling the published package:
    # build: .
    container_name: demo-server
    restart: unless-stopped
    ports:
      - "25565:25565/tcp"
      - "19132:19132/udp"
    volumes:
      - ./config.json:/app/config.json:ro
